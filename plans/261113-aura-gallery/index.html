<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ sưu tập hào quang</title>
<style>
body{margin:0;background:#2b2a26;color:#eee;font:14px "Segoe UI",Tahoma,sans-serif}
nav{display:flex;gap:16px;padding:10px 16px;align-items:center;flex-wrap:wrap}
label{display:flex;gap:6px;align-items:center}
#stage{position:relative;height:calc(100vh - 48px)}
canvas{width:100%;height:100%;display:block}
.cards{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}
.card{border:1px solid #0004;padding:4px 8px;font-size:13px;text-shadow:0 1px 2px #000}
</style></head><body>
<nav><label><input id="sit" type="checkbox">Ngồi thiền</label><label><input id="pause" type="checkbox">Dừng</label>
<label>Chân khí <select id="qi"><option value="0">0</option><option value="60">60</option><option value="200">200</option><option value="400">400</option><option value="900" selected>900</option></select></label>
<label>Góc <input id="angle" type="range" min="-3.14" max="3.14" step="0.01" value="0"></label>
<label>Khoảng cách <input id="dist" type="range" min="4" max="12" step="0.1" value="7"></label>
<label>Chỉ xem <select id="solo"><option value="">Tất cả</option></select></label></nav>
<div id="stage"><canvas></canvas><div class="cards" id="cards"></div></div>
<script type="module" src="./gallery.js"></script></body></html>
