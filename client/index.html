<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#21140e">
  <title>HTH – Tu viện bên cảng</title>
  <link rel="icon" href="data:,">
  <script type="module" src="/src/main.js"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="Cảnh tu viện 3D"></canvas>
  </div>

  <main id="welcome" hidden></main>

  <div id="hud" hidden>
    <div id="presence">
      <button id="onlineBtn" type="button" aria-label="Xem ai đang online" title="Người đang trên tu viện">
        <span class="presence-icon" data-icon="users"></span><b id="onlineCount">0</b>
      </button>
      <p class="visits">Hôm nay có <b id="visitsToday">0</b> lượt lên tu viện</p>
      <ul id="onlineList" hidden></ul>
      <button id="walletBtn" type="button" title="TEU đang có · bấm để mở Sạp Kim Bảo" aria-label="TEU đang có, mở cửa hàng">
        <span data-icon="coin"></span><b id="walletValue">0</b><small>TEU</small>
      </button>
    </div>

    <div id="toasts" aria-live="polite"></div>

    <nav id="menu">
      <button id="playBtn" class="icon-btn" type="button"><span data-icon="compass"></span><em>Chơi gì?</em></button>
      <button id="bookBtn" class="icon-btn" type="button"><span data-icon="book"></span><em>Sổ an</em></button>
      <button id="bagBtn" class="icon-btn" type="button" aria-label="Mở túi đồ (phím B)"><span data-icon="bag"></span><b id="bagCount" class="bag-badge"></b><em>Túi đồ</em></button>
      <button id="petBtn" class="icon-btn" type="button" aria-label="Mở thú cưng (phím P)"><span data-icon="paw"></span><em>Thú cưng</em></button>
      <button id="shopBtn" class="icon-btn" type="button"><span data-icon="shop"></span><em>Cửa hàng</em></button>
      <button id="boardBtn" class="icon-btn" type="button"><span data-icon="wish"></span><em>Bảng ước</em></button>
      <button id="shareBtn" class="icon-btn" type="button"><span data-icon="camera"></span><em>Chia sẻ</em></button>
      <button id="musicBtn" class="icon-btn" type="button" aria-controls="musicPanel" aria-expanded="false" aria-label="Mở nhạc nền"><span data-icon="music"></span><em>Nhạc</em></button>
      <button id="graphicsBtn" class="icon-btn" type="button" aria-label="Cài đặt đồ hoạ"><span data-icon="sliders"></span><em>Đồ hoạ</em></button>
      <button id="muteBtn" class="icon-btn" type="button"></button>
    </nav>

    <aside id="musicPanel" aria-label="Điều khiển nhạc nền" hidden>
      <div class="music-head"><span>Nhạc chung · Character Creation Song</span><button id="musicClose" type="button" aria-label="Đóng bảng điều khiển nhạc">Đóng</button></div>
      <div class="music-controls">
        <button id="musicSound" type="button" aria-pressed="false">Phát nhạc</button>
        <label for="musicVolume">Âm lượng</label>
        <input id="musicVolume" type="range" min="0" max="100" value="35" aria-label="Âm lượng nhạc nền">
        <output id="musicVolumeValue" for="musicVolume">35%</output>
      </div>
      <p>Nghe cùng đoạn với mọi người. Nhạc vẫn phát khi đóng bảng này.</p>
    </aside>
    <audio id="musicAudio" src="/music/where-winds-meet-character-creation.mp3" preload="metadata" loop hidden></audio>

    <div id="banner" role="status" hidden>
      <p id="bannerText"></p>
      <p id="bannerSub"></p>
    </div>

    <section id="wishReader" aria-live="polite" hidden></section>

    <button id="actionBtn" type="button" hidden>
      <span id="actionLabel"></span>
      <kbd class="key-hint">E</kbd>
    </button>

    <div id="emojiBar" aria-label="Biểu cảm nhanh"></div>
    <button id="emojiToggle" class="icon-btn" type="button" aria-label="Mở biểu cảm nhanh" aria-controls="emojiBar" aria-expanded="false"><span data-icon="smile"></span><em>Biểu cảm</em></button>
    <button id="chatBtn" class="icon-btn" type="button" aria-label="Mở ô chat"><span data-icon="chat"></span><em>Chat · Enter</em></button>
    <section id="chatHistory" aria-label="Lịch sử chat phiên này">
      <ol id="chatMessages" role="log" aria-live="polite" aria-relevant="additions"></ol>
    </section>
    <form id="chatForm" autocomplete="off" hidden>
      <input id="chatInput" type="text" placeholder="Nói gì đó với cả nhà…" enterkeyhint="send" aria-label="Nội dung chat">
      <button class="btn primary" type="submit">Gửi</button>
    </form>

    <div id="stick" aria-hidden="true"><div class="stick-knob"></div></div>
  </div>

  <div id="rhythmLayer"></div>
  <div id="modals"></div>
</body>
</html>
